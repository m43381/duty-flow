[project]
name = "dutyflow-optimizer"
version = "0.1.0"
description = "Optimization engine for Duty Flow"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dutyflow_optimizer"]
